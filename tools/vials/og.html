<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site/styles.css">
<style>
  /* app.js draws the site chrome; the card only wants the logo helpers */
  .ruo-strip, header.site, footer.site, .gate, .drawer, .drawer-bg, .bg { display: none !important; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: absolute; inset: 0; display: grid; grid-template-columns: 520px 1fr; align-items: center; }
  .og .brand { padding-left: 84px; display: flex; flex-direction: column; gap: 26px; }
  .og .lockup { display: flex; align-items: center; gap: 20px; margin-left: -14px; }
  .og .wordmark b { font-size: 2.9rem; letter-spacing: .3em; margin-right: -.3em; }
  .og .wordmark small { font-size: 1.02rem; letter-spacing: .72em; margin-top: 12px; }
  .og p { margin: 0; font-size: 1.32rem; line-height: 1.45; color: var(--muted); max-width: 22ch; }
  .og .url { font: 500 1rem/1 var(--mono, monospace); letter-spacing: .08em; color: var(--accent); }
  .og .vials { position: relative; height: 630px; }
  .og .vials canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body data-page="og">
<div class="og dark-band">
  <div class="brand">
    <div class="lockup" id="lockup"></div>
    <p>Research peptides, documented to the batch.</p>
    <div class="url" id="url"></div>
  </div>
  <div class="vials" id="vials"></div>
</div>
<script src="/site/data.js"></script>
<script src="/site/prices.js"></script>
<script src="/site/stock.js"></script>
<script src="/site/app.js"></script>
<script type="module">
// Link-preview card (media/og-image.jpg): logo + name, three vials from the live hero model.
// window.renderOG([left, centre, right]) — each { name, option, lot }.
import { mountHero } from './js/hero3d.js';
$("#lockup").innerHTML = `${markSVG(132, "", { tile: false })}<span class="wordmark"><b>ΛURΛ</b><small>PHARMA</small></span>`;
$("#url").textContent = BRAND.domain;
window.renderOG = (specs) => mountHero($("#vials"), { mark: MARK_PARTS, specs, animate: false });
window.READY = true;
</script>
</body></html>
